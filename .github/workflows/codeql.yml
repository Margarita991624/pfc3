name: CodeQL

# Invocado por CI en cada PR, push y ejecución manual.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  analyze:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
      packages: read
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Inicializar CodeQL
        uses: github/codeql-action/init@800a1d8701a65d150a672fef0923dbf2660a62ec # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended

      - name: Analizar y publicar en Code scanning
        id: analyze
        uses: github/codeql-action/analyze@800a1d8701a65d150a672fef0923dbf2660a62ec # v4
        with:
          category: /language:${{ matrix.language }}
          output: ${{ runner.temp }}/codeql-results

      # Se ejecuta aunque falle la subida del SARIF, siempre que el análisis haya producido resultados.
      - name: Rechazar hallazgos altos y críticos
        if: ${{ !cancelled() && steps.analyze.outcome != 'skipped' }}
        run: python3 .github/scripts/check_codeql.py "${{ runner.temp }}/codeql-results"

      - name: Conservar evidencia SARIF
        if: ${{ !cancelled() && steps.analyze.outcome != 'skipped' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: codeql-${{ matrix.language }}
          path: ${{ runner.temp }}/codeql-results/*.sarif
          if-no-files-found: error
          retention-days: 14
