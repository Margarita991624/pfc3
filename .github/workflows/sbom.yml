name: SBOM

# Inventario de componentes (CycloneDX) de cada versión que llega a main.
# Corre en cada push a main (código ya revisado y fusionado) y a mano.
# No usa workflow_run: evita hacer checkout de código no confiable en otro contexto
# (hallazgo de CodeQL actions/untrusted-checkout corregido en MORD-31).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web:
    name: SBOM CycloneDX (producción)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22

      - name: Instalar sin ejecutar scripts de paquetes
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Generar y validar inventario completo
        run: |
          npm run sbom -- sbom-web.cdx.json
          node -e "const s=require('./sbom-web.cdx.json');console.log('Componentes: '+s.components.length)" | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: sbom-web-${{ github.sha }}
          path: sbom-web.cdx.json
          if-no-files-found: error
          retention-days: 90
