name: SBOM

# Inventario de componentes (CycloneDX) de cada versión que llega a main.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: read

jobs:
  web:
    name: SBOM CycloneDX (producción)
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22

      - name: Instalar sin ejecutar scripts de paquetes
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Generar y validar inventario completo
        run: |
          npm run sbom -- sbom-web.cdx.json
          node -e "const s=require('./sbom-web.cdx.json');console.log('Componentes: '+s.components.length)" | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: sbom-web-${{ github.event.workflow_run.head_sha }}
          path: sbom-web.cdx.json
          if-no-files-found: error
          retention-days: 90
